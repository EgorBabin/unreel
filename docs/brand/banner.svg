  </defs>

  <rect width="1280" height="400" rx="28" fill="#0B0A17"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow1)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow2)"/>

  <!-- faint reel strip in the background -->
  <g opacity="0.07" fill="#fff">
    <rect x="860" y="40" width="120" height="200" rx="16"/>
    <rect x="1000" y="80" width="120" height="200" rx="16"/>
    <rect x="1140" y="40" width="120" height="200" rx="16"/>
    <rect x="930" y="260" width="120" height="200" rx="16"/>
    <rect x="1070" y="300" width="120" height="200" rx="16"/>
  </g>

  <!-- icon -->
  <g transform="translate(96 104) scale(0.375)">
    <rect width="512" height="512" rx="116" fill="url(#g)"/>
    <g mask="url(#cut)">
      <path fill="#fff" fill-rule="evenodd" d="M256 128a128 128 0 1 1 0 256a128 128 0 1 1 0-256ZM256 160a30 30 0 1 0 0 60a30 30 0 1 0 0-60ZM256 292a30 30 0 1 0 0 60a30 30 0 1 0 0-60ZM190 226a30 30 0 1 0 0 60a30 30 0 1 0 0-60ZM322 226a30 30 0 1 0 0 60a30 30 0 1 0 0-60ZM256 240a16 16 0 1 0 0 32a16 16 0 1 0 0-32Z"/>
    </g>
