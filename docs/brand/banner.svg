  <text x="326" y="200" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="92" font-weight="800" fill="url(#t)" letter-spacing="-1">Unreel</text>
  <text x="330" y="252" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="30" font-weight="500" fill="#A7A3C9">Block Instagram Reels. Keep yours.</text>

  <g font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="18" font-weight="600">
    <rect x="330" y="284" width="92" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="376" y="308" text-anchor="middle" fill="#E9E7FF">Chrome</text>
    <rect x="432" y="284" width="96" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12"/>
