    <rect x="538" y="284" width="100" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="588" y="308" text-anchor="middle" fill="#E9E7FF">Android</text>
